services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: echoes
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d echoes']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: echoes
      JWT_SECRET: dev-jwt-secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Optional real models. Fakes are used when no provider key is set.
      # AI_PROVIDER: gemini
      # GEMINI_API_KEY: set-me
      # GEMINI_EMBEDDING_MODEL: gemini-embedding-2
      # GEMINI_LLM_MODEL: gemini-3.8-flash
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      OPENAI_LLM_MODEL: gpt-4o-mini
      EMBEDDING_JOB_ATTEMPTS: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
